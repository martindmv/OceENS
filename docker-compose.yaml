services:
  oceens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Chemin dans le conteneur, qui l'emporte sur LOCAL_DATABASE_DIR de .env :
      # celui-ci désigne le dossier de l'hôte monté ci-dessous.
      LOCAL_DATABASE_DIR: /app/database
    volumes:
      - ${LOCAL_DATABASE_DIR:-./database}:/app/database
      - ./src/oceens/import:/app/.venv/lib/python3.12/site-packages/oceens/import
    restart: always
